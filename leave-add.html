<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Pengajuan Leave</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-100 min-h-screen py-8 px-4 flex justify-center items-start text-slate-800 font-sans"
  >
    <!-- Popup Notifikasi (Toast Notification) -->
    <div
      id="toast"
      class="fixed top-5 left-1/2 -translate-x-1/2 bg-black border border-emerald-200 text-white px-5 py-2.5 rounded-full shadow-lg flex items-center space-x-2 transition-all duration-300 opacity-0 pointer-events-none -translate-y-4 z-50"
    >
      <svg
        class="w-5 h-5 text-emerald-500"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M5 13l4 4L19 7"
        ></path>
      </svg>
      <span class="text-sm font-medium">Pengajuan leave berhasil disimpan</span>
    </div>

    <!-- Container Utama -->
    <div
      class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-6 relative"
    >
      <!-- Tombol Back Kiri Atas -->
      <div class="mb-4">
        <button
          type="button"
          id="backBtn"
          class="inline-flex items-center text-sm font-medium text-slate-500 hover:text-slate-800 transition-colors"
        >
          <svg
            class="w-4 h-4 mr-1"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            ></path>
          </svg>
          Kembali
        </button>
      </div>

      <!-- Header Form -->
      <div class="border-b border-slate-100 pb-4 mb-5">
        <h1 class="text-xl font-bold text-slate-900">Pengajuan Leave</h1>
        <p class="text-xs text-slate-500 mt-1">
          Isi formulir di bawah ini untuk mengajukan permohonan cuti/izin.
        </p>
      </div>

      <!-- Form -->
      <form id="leaveForm" class="space-y-4">
        <!-- Leave Type -->
        <div>
          <label
            for="leaveType"
            class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1"
            >Leave Type</label
          >
          <select
            id="leaveType"
            required
            class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
          >
            <option value="" disabled selected>Pilih jenis cuti</option>
            <option value="Annual Leave">Annual Leave</option>
            <option value="Sick Leave">Sick Leave</option>
            <option value="Personal Leave">Personal Leave</option>
            <option value="Unpaid Leave">Unpaid Leave</option>
          </select>
        </div>

        <!-- Period (Rentang Tanggal) -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label
              for="startDate"
              class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1"
              >Start Date</label
            >
            <input
              type="date"
              id="startDate"
              required
              class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
            />
          </div>
          <div>
            <label
              for="endDate"
              class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1"
              >End Date</label
            >
            <input
              type="date"
              id="endDate"
              required
              class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
            />
          </div>
        </div>

        <!-- Days (Total Hari) -->
        <div>
          <label
            for="days"
            class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1"
            >Days</label
          >
          <input
            type="text"
            id="days"
            readonly
            placeholder="Otomatis terhitung"
            class="w-full px-3 py-2 text-sm bg-slate-100 border border-slate-200 text-slate-500 rounded-lg focus:outline-none cursor-not-allowed"
          />
        </div>

        <!-- Reason -->
        <div>
          <label
            for="reason"
            class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1"
            >Reason</label
          >
          <textarea
            id="reason"
            rows="3"
            placeholder="Tuliskan alasan pengajuan..."
            required
            class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all resize-none"
          ></textarea>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button
            type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg shadow-sm hover:shadow transition-all duration-200 text-sm"
          >
            Submit
          </button>
        </div>
      </form>
    </div>

    <!-- Menghubungkan JavaScript -->
    <script src="js/leave-add.js"></script>
  </body>
</html>
