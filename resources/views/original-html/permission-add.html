<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Pengajuan Permission</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-100 min-h-screen py-8 px-4 flex justify-center items-start text-slate-800 font-sans"
  >
    <!-- Popup Notifikasi (Toast Notification) -->
    <div
      id="toast"
      class="fixed top-5 left-1/2 -translate-x-1/2 bg-black border border-emerald-200 text-white px-5 py-2.5 rounded-full shadow-lg flex items-center space-x-2 transition-all duration-300 opacity-0 pointer-events-none -translate-y-4 z-50"
    >
      <svg
        class="w-5 h-5 text-emerald-500"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M5 13l4 4L19 7"
        ></path>
      </svg>
      <span class="text-sm font-medium">Pengajuan izin berhasil disimpan</span>
    </div>

    <!-- Container Utama -->
    <div
      class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-6 relative"
    >
      <!-- Tombol Back Kiri Atas -->
      <div class="mb-4">
        <button
          type="button"
          id="backBtn"
          class="inline-flex items-center text-sm font-medium text-slate-500 hover:text-slate-800 transition-colors"
        >
          <svg
            class="w-4 h-4 mr-1"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            ></path>
          </svg>
          Kembali
        </button>
      </div>

      <!-- Header Form -->
      <div class="border-b border-slate-100 pb-4 mb-5">
        <h1 class="text-xl font-bold text-slate-900">Pengajuan Permission</h1>
        <p class="text-xs text-slate-500 mt-1">
          Isi formulir di bawah ini untuk mengajukan perizinan kerja.
        </p>
      </div>

      <!-- Form -->
      <form id="permissionForm" class="space-y-4">
        <!-- Permission Type -->
        <div>
          <label
            for="permissionType"
            class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1"
            >Permission Type</label
          >
          <select
            id="permissionType"
            required
            class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
          >
            <option value="" disabled selected>Pilih jenis izin</option>
            <option value="WFH">WFH (Work From Home)</option>
            <option value="Arrive Late">Arrive Late</option>
            <option value="Leave Early">Leave Early</option>
            <option value="Pop Out">Pop Out</option>
            <option value="Business Trip">Business Trip</option>
          </select>
        </div>

        <!-- Date -->
        <div>
          <label
            for="date"
            class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1"
            >Date</label
          >
          <input
            type="date"
            id="date"
            required
            class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
          />
        </div>

        <!-- Time Range (Rentang Waktu) -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label
              for="startTime"
              class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1"
              >Start Time</label
            >
            <input
              type="time"
              id="startTime"
              required
              class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
            />
          </div>
          <div>
            <label
              for="endTime"
              class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1"
              >End Time</label
            >
            <input
              type="time"
              id="endTime"
              required
              class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
            />
          </div>
        </div>

        <!-- Duration (Otomatis terhitung) -->
        <div>
          <label
            for="duration"
            class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1"
            >Duration</label
          >
          <input
            type="text"
            id="duration"
            readonly
            placeholder="Otomatis terhitung"
            class="w-full px-3 py-2 text-sm bg-slate-100 border border-slate-200 text-slate-500 rounded-lg focus:outline-none cursor-not-allowed"
          />
        </div>

        <!-- Reason -->
        <div>
          <label
            for="reason"
            class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1"
            >Reason</label
          >
          <textarea
            id="reason"
            rows="3"
            placeholder="Tuliskan alasan pengajuan..."
            required
            class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all resize-none"
          ></textarea>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button
            type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg shadow-sm hover:shadow transition-all duration-200 text-sm"
          >
            Submit
          </button>
        </div>
      </form>
    </div>

    <!-- Menghubungkan JavaScript External -->
    <script src="js/permission-add.js"></script>
  </body>
</html>
